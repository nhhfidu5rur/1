name: Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

# إضافة الصلاحيات لضمان قدرة البوت على إنشاء Release ورفع الملفات
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17' # تم التحديث إلى 17 لأن Gradle 7.6 يعمل بشكل أفضل وأكثر استقراراً معها
        distribution: 'temurin'
        cache: gradle
    
    - name: Build APK
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: '7.6'
        arguments: assembleDebug
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Create Release
      # سيقوم بإنشاء Release فقط عند الرفع على فرع main وبشرط نجاح البناء
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        # جعل رقم الإصدار ديناميكي (يتغير مع كل عملية بناء) ليتجنب خطأ تكرار الـ Tag
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        body: |
          Automated build from GitHub Actions.
          Build number: ${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
